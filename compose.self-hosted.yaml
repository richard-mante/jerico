name: jerico-self-hosted

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jerico
      POSTGRES_USER: jerico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - jerico-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerico -d jerico"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: jerico
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - jerico-clickhouse:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/queue-worker/Dockerfile
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://jerico:${POSTGRES_PASSWORD}@postgres:5432/jerico
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/queue-worker/Dockerfile
    command: ["pnpm", "--filter", "@jerico/api-node", "start"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://jerico:${POSTGRES_PASSWORD}@postgres:5432/jerico
      BETTER_AUTH_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      WEB_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPTIME_RESULTS_SECRET: ${UPTIME_RESULTS_SECRET:?Set UPTIME_RESULTS_SECRET in .env}
      NOTIFICATION_DELIVERY_SECRET: ${NOTIFICATION_DELIVERY_SECRET:?Set NOTIFICATION_DELIVERY_SECRET in .env}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in .env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: jerico
      CLICKHOUSE_TABLE: telemetry_events
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
      DATABASE_POOL_MAX: ${API_DATABASE_POOL_MAX:-12}
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingest:
    build:
      context: .
      dockerfile: apps/queue-worker/Dockerfile
    command: ["pnpm", "--filter", "@jerico/ingest-node", "start"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: postgresql://jerico:${POSTGRES_PASSWORD}@postgres:5432/jerico
      TELEMETRY_QUEUE_NAME: jerico-telemetry
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
      INGEST_DAILY_EVENT_LIMIT: ${INGEST_DAILY_EVENT_LIMIT:-100000}
      INGEST_RATE_LIMIT_REQUESTS: ${INGEST_RATE_LIMIT_REQUESTS:-120}
      INGEST_RATE_LIMIT_WINDOW_SECONDS: ${INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      DATABASE_POOL_MAX: ${INGEST_DATABASE_POOL_MAX:-12}
    ports:
      - "127.0.0.1:${INGEST_PORT:-8788}:8788"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue-worker:
    build:
      context: .
      dockerfile: apps/queue-worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8789
      DATABASE_URL: postgresql://jerico:${POSTGRES_PASSWORD}@postgres:5432/jerico
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: jerico
      CLICKHOUSE_TABLE: telemetry_events
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      QUEUE_ADMIN_TOKEN: ${QUEUE_ADMIN_TOKEN:?Set QUEUE_ADMIN_TOKEN in .env}
      API_URL: http://api:8787
      ALLOW_INTERNAL_API_HTTP: "true"
      PROBE_WORKER_HOST: api
      UPTIME_RESULTS_SECRET: ${UPTIME_RESULTS_SECRET:?Set UPTIME_RESULTS_SECRET in .env}
      NOTIFICATION_DELIVERY_SECRET: ${NOTIFICATION_DELIVERY_SECRET:?Set NOTIFICATION_DELIVERY_SECRET in .env}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      UPTIME_QUEUE_NAME: jerico-uptime-probes
      NOTIFICATION_QUEUE_NAME: jerico-notifications
      TELEMETRY_QUEUE_NAME: jerico-telemetry
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-5}
      QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE:-20}
      QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_VISIBILITY_TIMEOUT_SECONDS:-60}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-1000}
    ports:
      - "127.0.0.1:${QUEUE_WORKER_PORT:-8789}:8789"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      INGEST_DOMAIN: ${INGEST_DOMAIN:?Set INGEST_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - jerico-caddy-data:/data
      - jerico-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jerico-postgres:
  jerico-clickhouse:
  jerico-caddy-data:
  jerico-caddy-config:
