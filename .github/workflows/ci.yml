name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
      CLICKHOUSE_TEST_DATABASE: jerico
      CLICKHOUSE_TEST_USERNAME: jerico
      CLICKHOUSE_TEST_PASSWORD: jerico_test
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8.14.39-alpine
        env:
          CLICKHOUSE_DB: jerico
          CLICKHOUSE_USER: jerico
          CLICKHOUSE_PASSWORD: jerico_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user jerico --password jerico_test --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @jerico/api test:integration
      - run: pnpm build
